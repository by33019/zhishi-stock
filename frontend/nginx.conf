server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 上游用**变量**形式传，并显式声明 Docker 的内嵌 DNS。
  #
  # 为什么不能直接写 `proxy_pass http://stock-api:8080;`：
  # nginx 对**字面量**上游只在**启动时**解析一次主机名，然后把 IP 缓存下来。
  # 而 docker-compose 重建容器会分配新 IP —— 于是 `docker-compose up -d --build`
  # 之后 nginx 仍然打旧 IP，全站 `/api/**` 变成 502。
  # 前端拿到 502 的 HTML 页面，apiClient 解析不出响应壳，报的却是
  # 「服务返回了无法识别的数据」（INVALID_RESPONSE），看起来像前端没写完，
  # 而后端其实是好的 —— 排查方向会被彻底带偏。
  #
  # 用变量 + resolver 之后，解析发生在**每次请求**时（结果缓存 10 秒），
  # 后端换 IP 最多 10 秒后自愈。
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $stock_api http://stock-api:8080;
    proxy_pass $stock_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI 任务事件流（AI-05）。前缀比 /api/ 长，AI 路径落在这里而不是上面的通用转发。
  #
  # SSE 有两个默认值必须显式推翻：
  # - proxy_buffering 默认开：事件会被攒进缓冲区，前端看不到"逐字出现"，
  #   而是几分钟后的"一次性倾泻"——流式就失去意义了。
  # - proxy_read_timeout 默认 60s：模型生成两段之间若静默超过一分钟，
  #   nginx 会掐断上游连接，前端表现为流"无故中断"。
  location /api/v1/ai/ {
    set $stock_api http://stock-api:8080;
    proxy_pass $stock_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 长连接：HTTP/1.1 + 空 Connection 头，避免每条事件都新建上游连接。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
