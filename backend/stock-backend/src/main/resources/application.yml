server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stock-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:stock}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

stock:
  auth:
    jwt-secret: ${JWT_SECRET:}
    cookie-secure: ${COOKIE_SECURE:true}
  market:
    scenario: ${MARKET_SCENARIO:NORMAL}
    # 模拟交易日历的节假日集合，逗号分隔 ISO 日期。真实日历源就位后此项不再需要。
    holidays: ${MARKET_HOLIDAYS:}
  ai:
    # AI Provider 与模型标识。当前只有确定性模拟实现，真实 LLM 源就位后换实现即可。
    provider-code: ${AI_PROVIDER_CODE:SIMULATED}
    model-code: ${AI_MODEL_CODE:sim-analyst-v1}
    # 实现模式：SIMULATED（确定性占位，CI 与本地默认）/ OPENAI_COMPATIBLE（真实供应商）。
    # 显式要求 OPENAI_COMPATIBLE 而缺 api-key 时启动即失败，**不静默回落**到模拟实现——
    # 那会产出一份带着真实证据编号、读起来与真报告无异的占位文本。
    llm-mode: ${AI_LLM_MODE:SIMULATED}
    # OpenAI 兼容协议的基地址（需含版本段）。通义 compatible-mode 即 OpenAI 协议。
    base-url: ${AI_BASE_URL:}
    # 密钥只从环境变量来。默认空值配合 llm-mode=SIMULATED 时不会触发任何外网调用。
    api-key: ${AI_API_KEY:}
    # 单次模型调用的总时限。推理模型先产出思维链再产出正文，需要长于普通对话模型。
    llm-timeout-seconds: ${AI_LLM_TIMEOUT_SECONDS:120}
    # 单个任务可进入 AI 上下文的资讯证据条数上限。
    news-evidence-limit: ${AI_NEWS_EVIDENCE_LIMIT:20}
    # ---- M3-07 任务编排 ----
    # 单用户每日任务上限（契约 §26.4 的 dailyLimit，口径 = 今日创建的**任务**数）。
    daily-task-limit: ${AI_DAILY_TASK_LIMIT:20}
    # 单用户并发上限（契约 §13.5）：活跃任务数，终态自然释放。
    max-concurrent-tasks: ${AI_MAX_CONCURRENT_TASKS:2}
    # 超时阈值：超过即由 Worker 置 TIMED_OUT，不再等 LLM。
    # 默认由 60 提到 180：真实推理模型要先产出思维链（实测一次简短问答的思维链
    # 就占 69 个 reasoning token），60 秒会让正常任务被判超时。必须大于
    # llm-timeout-seconds，否则任务先超时而模型还在输出，调用被白白丢弃。
    task-deadline-seconds: ${AI_TASK_DEADLINE_SECONDS:180}
    # 事件流（chunk / status）的保留期；报告本身落 ai_report，不受此影响。
    chunk-retention-minutes: ${AI_CHUNK_RETENTION_MINUTES:30}
    # 写进 ai_report 的版本标识：将来换 Prompt 或换内容结构时，历史报告仍能自我说明。
    prompt-version: ${AI_PROMPT_VERSION:p1}
    content-schema-version: ${AI_CONTENT_SCHEMA_VERSION:v1}
    # 单次调用的输出上限，透传给 LlmProviderPort。
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    # ---- SSE 中继（AI-05）----
    # Servlet 栈下每条 SSE 连接占一个线程（中继是阻塞循环），所以 threads 就是
    # 并发 SSE 连接数的上限。设小了会让新连接排队到超时。
    stream:
      threads: ${AI_STREAM_THREADS:32}
      # 单条连接的最长存活时间。它是兜底：任务若因未预料的路径停在非终态，
      # 连接不会永久挂着（前端最多多一次重连）。
      timeout-seconds: ${AI_STREAM_TIMEOUT_SECONDS:120}
      max-duration-seconds: ${AI_STREAM_MAX_DURATION_SECONDS:900}
      batch-size: ${AI_STREAM_BATCH_SIZE:100}
      poll-delay-ms: ${AI_STREAM_POLL_DELAY_MS:200}
      partial-content-scan-limit: ${AI_STREAM_PARTIAL_SCAN_LIMIT:500}
  seed:
    demo-username: ${DEMO_USERNAME:demo}
    demo-password: ${DEMO_PASSWORD:Stock@123}
  # ---- M3-12 导出（EXP-01~EXP-04）----
  export:
    # 导出文件存放目录。**必须与 stock-job 指向同一个卷**（见 compose.yaml 的 export-files）：
    # 文件由本进程写出与下载，到期由 stock-job 删除；两边看到不同目录时，
    # 清理会把作业记录删掉而文件永远留在本进程的卷上，且不会有任何报错。
    # 默认值 ./data/exports 与镜像的 WORKDIR /app 拼出 /app/data/exports，正是卷的挂载点。
    directory: ${STOCK_EXPORT_DIRECTORY:./data/exports}
    # 生成线程池。刻意用**有界队列 + 直接拒绝**：队列满时报 EXPORT_BUSY(503)，
    # 而不是让任务在无界队列里静默堆积（内存涨、用户等到超时）。
    threads: ${STOCK_EXPORT_THREADS:4}
    queue-capacity: ${STOCK_EXPORT_QUEUE_CAPACITY:64}
    # 保留期与限流次数不在这里配置：它们是与 24 小时文件保留期配套的契约数字，
    # 定义在 ExportPolicy 一处（记录必须长于文件，否则"文件过期"与"id 不存在"就分不开）。
