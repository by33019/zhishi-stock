spring:
  application:
    name: stock-job
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:stock}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai

stock:
  market:
    scenario: ${MARKET_SCENARIO:NORMAL}
    # 必须与 stock-backend 使用同一个值：采集侧与查询侧对"今天是哪一天"的判断
    # 一旦分叉，落盘的快照会与接口回退到不同交易日，且不会有任何报错。
    holidays: ${MARKET_HOLIDAYS:}
    collect-initial-delay-ms: ${MARKET_COLLECT_INITIAL_DELAY_MS:1000}
    collect-delay-ms: ${MARKET_COLLECT_DELAY_MS:60000}
  news:
    # 架构 §"新闻/公告增量采集 每 2 分钟"。不传游标：增量判据由来源 ID 幂等承担。
    collect-initial-delay-ms: ${NEWS_COLLECT_INITIAL_DELAY_MS:1000}
    collect-delay-ms: ${NEWS_COLLECT_DELAY_MS:120000}
  export:
    # **必须与 stock-backend 用同一个值、且指向同一个卷**（compose.yaml 的 export-files）：
    # 文件由 API 写出、由本进程清理，两边看到不同目录时清理会把作业记录删掉、
    # 文件永远留在 API 的卷上，且不会有任何报错。
    directory: ${STOCK_EXPORT_DIRECTORY:./data/exports}
    sweep-initial-delay-ms: ${STOCK_EXPORT_SWEEP_INITIAL_DELAY_MS:60000}
    sweep-delay-ms: ${STOCK_EXPORT_SWEEP_DELAY_MS:600000}
    # 单轮清理上限。清理是后台任务，宁可每轮少做一点，也不要一次把整卷读一遍。
    sweep-batch-size: ${STOCK_EXPORT_SWEEP_BATCH_SIZE:200}
